<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<title>Meki AM Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="meki.css">
</head>
<body>

<!-- LANDING PAGE (Tampil Pertama Kali) -->
<div id="landingScreen">
  <!-- Video Background Full Screen -->
  <video id="landingVideo" autoplay loop muted playsinline src="meki.mp4"></video>
  
  <div class="landing-overlay"></div>
  
  <div class="landing-content">
    <h1>Welcome to Meki Engine</h1>
    <p>Please log in or buy access to continue</p>
    <div class="landing-buttons">
      <button id="btnGoToLogin">Login</button>
      <button onclick="window.open('https://wa.me/6281234567890', '_blank')">Buy Access</button>
    </div>
  </div>
  
  <div class="landing-footer">
    <p>Contact Us</p>
    <!-- Icon Telegram & TikTok (SVG) diisi otomatis lewat meki.js -->
    <div class="socials" id="landingSocials"></div>
    <p>© 2026 Meki Engine</p>
  </div>
</div>

<!-- LOADING SCREEN -->
<div id="loaderScreen">
  <video id="bannerVideo" autoplay playsinline muted src="meki.mp4"></video>
  <div class="loader-overlay"></div>
  <button class="skip-btn" id="skipBtn"></button>
  <div class="loader-content">
    <div class="loader-kicker"></div>
    <div class="loader-title"></div>
    <div class="loader-sub"></div>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
  </div>
</div>

<!-- LOGIN SCREEN (Form Username & Password) -->
<div id="loginScreen">
  <div class="login-card" id="loginCard"></div>
</div>

<!-- MAIN APP (Dashboard Utama) -->
<div id="mainApp">
  <header class="top-header" id="topHeader"></header>
  
  <main id="page-home" class="page active"></main>
  <main id="page-am" class="page" style="padding:15px"></main>
  <main id="page-musik" class="page" style="padding:15px"></main>
  <main id="page-perhatian" class="page" style="padding:15px"></main>
  <main id="page-info" class="page" style="padding:15px"></main>
  
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- SIDEBAR & MODALS -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<audio id="globalAudio" preload="metadata"></audio>

<!-- SCRIPT JS -->
<script type="module" src="meki.js"></script>
</body>
</html>
